[project]
name = "sistema-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "python-pptx>=0.6.23",
  "pypdf>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
